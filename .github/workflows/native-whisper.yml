name: Native Whisper

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Gateway and Whisper release version
        default: dev
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Preserve source/toolchain auditing; Whisper must also match the release
      # version expected by already-installed native update managers.
      - name: Identify native sources and resolved toolchains
        id: native-identity
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 scripts/native-build-cache.py identity whisper --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - name: Include the Whisper release version in the compiled cache identity
        id: release-identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NATIVE_SOURCE_KEY: ${{ steps.native-identity.outputs.key }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          version = os.environ['RELEASE_VERSION'].removeprefix('v')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]*', version):
              raise SystemExit('Expected a nonempty release version or CI revision')
          version_digest = hashlib.sha256(version.encode()).hexdigest()
          key = os.environ['NATIVE_SOURCE_KEY'] + '-version-' + version_digest
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'key={key}\nversion={version}\n')
          PY
      - name: Restore compiled helper by exact identity
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/whisper
          key: ${{ steps.release-identity.outputs.key }}
      - name: Clear incomplete or non-exact cached outputs
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 scripts/native-build-cache.py clean whisper --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - name: Build static musl Linux helper
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.os == 'linux'
        env:
          VERSION: ${{ steps.release-identity.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-whisper-linux.sh "$TARGET_ARCH"
      - name: Build macOS helper using system libraries
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.os == 'darwin'
        env:
          VERSION: ${{ steps.release-identity.outputs.version }}
          WHISPER_TARGET_ARCH: ${{ matrix.arch }}
          WHISPER_TARGET_OS: darwin
        run: bash scripts/build-whisper.sh
      - name: Record compiled helper inventory
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CACHE_KEY: ${{ steps.release-identity.outputs.key }}
          NATIVE_VERSION: ${{ steps.release-identity.outputs.version }}
        run: python3 scripts/native-build-cache.py record whisper --os "$TARGET_OS" --arch "$TARGET_ARCH" --key "$CACHE_KEY" --version "$NATIVE_VERSION"
      - name: Audit helper inventory and exact expected release version
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CACHE_KEY: ${{ steps.release-identity.outputs.key }}
          NATIVE_VERSION: ${{ steps.release-identity.outputs.version }}
        run: python3 scripts/native-build-cache.py verify whisper --os "$TARGET_OS" --arch "$TARGET_ARCH" --key "$CACHE_KEY" --version "$NATIVE_VERSION"
      - name: Verify real speech, warm model, protocol framing and EOF
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 native/whisper/smoke.py "dist/whisper/codex-whisper-$TARGET_OS-$TARGET_ARCH"
      # Never save PR outputs. Main seeds caches visible to other branches/tags.
      - name: Cache successfully validated compiled helper
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/whisper
          key: ${{ steps.release-identity.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisper-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/whisper/codex-whisper-*
