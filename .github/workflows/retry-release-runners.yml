name: Retry release runner capacity

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: retry-release-runners-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      # workflow_run is privileged: execute only this default-branch code. Do
      # not check out the triggering revision or download any of its artifacts.
      - name: Retry only confirmed unassigned macOS ARM capacity failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          API = "https://api.github.com"
          MAX_ATTEMPTS = 3
          CAPACITY_JOBS = {
              f"{family} / build (darwin, arm64, {runner})"
              for family in ("native-speech", "native-whisper")
              for runner in ("macos-15", "macos-26")
          }
          DEPENDENT_JOBS = {"package", "test-and-build", "publish"}
          NOT_ACQUIRED = "The job was not acquired by Runner of type hosted even after multiple attempts"
          CAPACITY = "Due to capacity constraints, jobs targeting macOS arm64 runners may experience longer queue times."

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def api(method, path, token):
              request = urllib.request.Request(
                  API + path, method=method, data=b"{}" if method == "POST" else None,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              # Never forward the job token to a redirected origin.
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  data = response.read()
              return json.loads(data) if data else None

          def valid_run(run, repository):
              if not isinstance(run, dict):
                  return False
              return (
                  type(run.get("id")) is int and run["id"] > 0
                  and type(run.get("run_attempt")) is int
                  and 1 <= run["run_attempt"] < MAX_ATTEMPTS
                  and run.get("name") == "Release"
                  and run.get("path") == ".github/workflows/release.yml"
                  and run.get("event") == "push"
                  and run.get("status") == "completed"
                  and run.get("conclusion") in ("failure", "cancelled")
                  and isinstance(run.get("head_branch"), str)
                  and re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", run["head_branch"]) is not None
                  and isinstance(run.get("head_sha"), str)
                  and re.fullmatch(r"[0-9a-f]{40}", run["head_sha"]) is not None
                  and isinstance(run.get("repository"), dict)
                  and run["repository"].get("full_name") == repository
                  and isinstance(run.get("head_repository"), dict)
                  and run["head_repository"].get("full_name") == repository
              )

          def same_run(run, original, repository):
              return valid_run(run, repository) and all(
                  run.get(key) == original.get(key)
                  for key in ("id", "run_attempt", "workflow_id", "name", "path", "event",
                              "head_branch", "head_sha", "conclusion")
              )

          def latest_jobs(base, run, token):
              jobs = []
              total = None
              for page in range(1, 11):
                  result = api("GET", f"{base}/actions/runs/{run['id']}/attempts/{run['run_attempt']}/jobs?per_page=100&page={page}", token)
                  if not isinstance(result, dict) or type(result.get("total_count")) is not int:
                      raise ValueError("Invalid jobs response")
                  if total is None:
                      total = result["total_count"]
                  if result["total_count"] != total or not 0 < total <= 1000 or not isinstance(result.get("jobs"), list):
                      raise ValueError("Incomplete jobs response")
                  jobs.extend(result["jobs"])
                  if len(jobs) >= total:
                      if len(jobs) != total or any(not isinstance(job, dict) for job in jobs):
                          raise ValueError("Invalid jobs inventory")
                      ids = [job.get("id") for job in jobs]
                      if any(type(job_id) is not int or job_id <= 0 for job_id in ids) or len(set(ids)) != len(ids):
                          raise ValueError("Duplicate or invalid jobs")
                      return jobs
                  if len(result["jobs"]) != 100:
                      raise ValueError("Truncated jobs response")
              raise ValueError("Jobs inventory exceeds bound")

          def capacity_annotations(base, job, token):
              # The check ID is not assumed to equal the Actions job ID. Only
              # accept a check URL in this exact repository and API origin.
              url = job.get("check_run_url")
              if not isinstance(url, str):
                  return False
              match = re.fullmatch(re.escape(API + base + "/check-runs/") + r"([1-9][0-9]*)", url)
              if match is None:
                  return False
              seen = set()
              for page in range(1, 11):
                  annotations = api("GET", f"{base}/check-runs/{match[1]}/annotations?per_page=100&page={page}", token)
                  if not isinstance(annotations, list):
                      return False
                  for annotation in annotations:
                      if not isinstance(annotation, dict):
                          return False
                      evidence = (annotation.get("annotation_level"), annotation.get("message"))
                      if evidence not in (("failure", NOT_ACQUIRED), ("notice", CAPACITY)):
                          return False
                      seen.add(evidence)
                  if len(annotations) < 100:
                      return seen == {("failure", NOT_ACQUIRED), ("notice", CAPACITY)}
              return False

          def retry(event, repository, token):
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                  return False
              if not isinstance(event, dict) or event.get("action") != "completed":
                  return False
              if not isinstance(event.get("repository"), dict) or event["repository"].get("full_name") != repository:
                  return False
              original = event.get("workflow_run")
              if not valid_run(original, repository):
                  return False
              base = "/repos/" + repository
              run_path = f"{base}/actions/runs/{original['id']}"
              run = api("GET", run_path, token)
              if not same_run(run, original, repository):
                  return False
              candidates = []
              for job in latest_jobs(base, run, token):
                  if job.get("run_id") != run["id"] or job.get("run_attempt") != run["run_attempt"] or job.get("status") != "completed":
                      return False
                  conclusion = job.get("conclusion")
                  if conclusion == "success":
                      continue
                  if conclusion == "skipped" and job.get("name") in DEPENDENT_JOBS:
                      continue
                  if (conclusion != "cancelled" or job.get("name") not in CAPACITY_JOBS
                          or job.get("steps") != [] or job.get("runner_id") not in (0, None)
                          or job.get("runner_name") not in ("", None)):
                      return False
                  candidates.append(job)
              if not 1 <= len(candidates) <= 2 or len({job["name"].split(" / ")[0] for job in candidates}) != len(candidates):
                  return False
              if not all(capacity_annotations(base, job, token) for job in candidates):
                  return False
              # Another actor may already have requested a rerun. Check the
              # latest status and attempt again immediately before mutating.
              if not same_run(api("GET", run_path, token), original, repository):
                  return False
              api("POST", run_path + "/rerun-failed-jobs", token)
              print(f"Requested release run {run['id']} attempt {run['run_attempt'] + 1}/{MAX_ATTEMPTS}.")
              return True

          def main():
              try:
                  if os.environ.get("GITHUB_EVENT_NAME") != "workflow_run" or os.environ.get("GITHUB_API_URL") != API:
                      raise ValueError("Unsupported workflow context")
                  with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                      event = json.load(source)
                  if not retry(event, os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"]):
                      print("No retry: run did not meet the bounded hosted-runner capacity policy.")
              except (OSError, ValueError, TypeError, KeyError, urllib.error.URLError):
                  # API response bodies and the token must never reach logs.
                  raise SystemExit("Runner retry refused: could not verify the complete release state.") from None

          if __name__ == "__main__":
              main()
          PY
