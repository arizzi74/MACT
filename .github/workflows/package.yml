name: Release packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      artifact-name:
        type: string
        default: release-files

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: whisper-*
          merge-multiple: true
          path: .native-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: speech-*
          merge-multiple: true
          path: .speech-dist
      - name: Build all platform packages
        env:
          VERSION: ${{ inputs.version }}
        run: VERSION="${VERSION#v}" ./scripts/release.sh
      - name: Verify packaged native runtime versions
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: bash scripts/verify-release-runtime-versions.sh "$EXPECTED_VERSION"
      - name: Audit complete release payload
        run: ./scripts/verify-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          path: dist/
