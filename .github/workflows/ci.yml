name: CI

on:
  # Release tags receive independent checks in release.yml.
  push:
    branches:
      - '**'
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch/PR checks do not compete with the latest change. Releases
# have their own non-cancelling group and remain independent.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml

  native-session-archive:
    uses: ./.github/workflows/native-session-archive.yml

  go-checks:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/go-checks.yml

  native-whisper:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/native-whisper.yml
    with:
      version: ${{ github.sha }}

  native-speech:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/native-speech.yml
    with:
      version: ${{ github.sha }}

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  package:
    needs: [native-whisper, native-speech]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.sha }}
      artifact-name: release-artifacts

  # Keep one final gate. No required job can fail or be skipped unnoticed.
  test:
    if: always() && github.event_name != 'schedule'
    needs: [go-checks, browser, native-session-archive, package, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation and packaging job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: result['result'] for name, result in results.items() if result['result'] != 'success'}
          if failed:
              raise SystemExit(f'CI gates did not succeed: {failed}')
          print('All CI gates passed.')
          PY

  vulnerabilities:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Check new vulnerability advisories
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
