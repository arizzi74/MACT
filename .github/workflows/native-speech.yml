name: Native Speech

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Gateway release version (native helpers use source versions)
        default: dev
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      # Cache compilation only. Real inference checks below run on every restore.
      - name: Identify native sources and resolved toolchains
        id: native-identity
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 scripts/native-build-cache.py identity speech --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - name: Restore compiled helpers by exact identity
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/piper
            dist/qwen-tts
          key: ${{ steps.native-identity.outputs.key }}
      - name: Clear incomplete or non-exact cached outputs
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 scripts/native-build-cache.py clean speech --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - name: Build Linux helpers with portable compiler baselines
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.os == 'linux'
        env:
          VERSION: ${{ steps.native-identity.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/build-piper-linux.sh "$TARGET_ARCH"
          bash scripts/build-qwen-tts-linux.sh "$TARGET_ARCH"
      - name: Build macOS helpers
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.os == 'darwin'
        env:
          VERSION: ${{ steps.native-identity.outputs.version }}
        run: |
          bash scripts/build-piper.sh
          bash scripts/build-qwen-tts.sh
      - name: Record compiled helper inventory
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CACHE_KEY: ${{ steps.native-identity.outputs.key }}
          NATIVE_VERSION: ${{ steps.native-identity.outputs.version }}
        run: python3 scripts/native-build-cache.py record speech --os "$TARGET_OS" --arch "$TARGET_ARCH" --key "$CACHE_KEY" --version "$NATIVE_VERSION"
      - name: Audit helper archives, inventories and embedded source versions
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CACHE_KEY: ${{ steps.native-identity.outputs.key }}
          NATIVE_VERSION: ${{ steps.native-identity.outputs.version }}
        run: python3 scripts/native-build-cache.py verify speech --os "$TARGET_OS" --arch "$TARGET_ARCH" --key "$CACHE_KEY" --version "$NATIVE_VERSION"
      - name: Download and verify pinned smoke models
        shell: bash
        run: |
          set -euo pipefail
          source native/piper/source.env
          source native/qwen-tts/source.env
          model_dir="$RUNNER_TEMP/native-speech-models"
          mkdir -p "$model_dir/piper" "$model_dir/qwen-tts"
          fetch_model() {
            local url="$1" path="$2" size="$3" digest="$4" actual
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 5 --retry-delay 15 --retry-max-time 300 --max-filesize "$size" "$url" -o "$path"
            test "$(wc -c < "$path" | tr -d ' ')" -eq "$size"
            if command -v sha256sum >/dev/null; then actual=$(sha256sum "$path" | cut -d ' ' -f 1)
            else actual=$(shasum -a 256 "$path" | cut -d ' ' -f 1); fi
            test "$actual" = "$digest"
          }
          fetch_model "$PIPER_MODEL_URL" "$model_dir/miro.tar.bz2" "$PIPER_MODEL_BYTES" "$PIPER_MODEL_SHA256"
          fetch_model "$PIPER_ENGLISH_MODEL_URL" "$model_dir/ryan.tar.bz2" "$PIPER_ENGLISH_MODEL_BYTES" "$PIPER_ENGLISH_MODEL_SHA256"
          python3 - "$model_dir" "$PIPER_MODEL_ROOT" "$PIPER_MODEL_FILES" "$PIPER_MODEL_UNCOMPRESSED_BYTES" "$PIPER_MODEL_ONNX_BYTES" "$PIPER_ENGLISH_MODEL_ROOT" "$PIPER_ENGLISH_MODEL_FILES" "$PIPER_ENGLISH_MODEL_UNCOMPRESSED_BYTES" "$PIPER_ENGLISH_MODEL_ONNX_BYTES" <<'PY'
          import os, pathlib, shutil, sys, tarfile
          model_dir = pathlib.Path(sys.argv[1])
          root = model_dir / "piper"
          for voice_name, offset in (("miro", 2), ("ryan", 6)):
              prefix, expected_files, expected_bytes, largest_file = sys.argv[offset:offset + 4]
              expected_files, expected_bytes, largest_file = map(int, (expected_files, expected_bytes, largest_file))
              count = files = total = 0
              seen = set()
              with tarfile.open(model_dir / (voice_name + ".tar.bz2"), "r:bz2") as source:
                  for entry in source:
                      count += 1
                      name = entry.name.rstrip("/")
                      path = pathlib.PurePosixPath(name)
                      if (count > expected_files + 64 or not name or name in seen or "\\" in name or path.is_absolute()
                              or any(part in ("", ".", "..") for part in name.split("/"))
                              or path.parts[0] != prefix or entry.mode & 0o7000
                              or not (entry.isdir() or entry.isfile())):
                          raise SystemExit("Invalid pinned Piper archive structure")
                      seen.add(name)
                      target = root.joinpath(*path.parts)
                      if entry.isdir():
                          target.mkdir(parents=True, exist_ok=True, mode=0o700)
                          continue
                      files += 1
                      total += entry.size
                      if entry.size < 0 or entry.size > largest_file or total > expected_bytes:
                          raise SystemExit("Piper extraction exceeds pinned bounds")
                      target.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                      with source.extractfile(entry) as src, target.open("xb") as dst:
                          shutil.copyfileobj(src, dst)
                      os.chmod(target, 0o600)
              if (files, total) != (expected_files, expected_bytes):
                  raise SystemExit("Incomplete pinned Piper archive")
          PY
          qwen_url="https://huggingface.co/ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF/resolve/$QWEN_TTS_MODEL_REVISION"
          fetch_model "$qwen_url/$QWEN_TTS_MODEL_NAME?download=true" "$model_dir/qwen-tts/$QWEN_TTS_MODEL_NAME" "$QWEN_TTS_MODEL_SIZE" "$QWEN_TTS_MODEL_SHA256"
          fetch_model "$qwen_url/$QWEN_TTS_MMPROJ_NAME?download=true" "$model_dir/qwen-tts/$QWEN_TTS_MMPROJ_NAME" "$QWEN_TTS_MMPROJ_SIZE" "$QWEN_TTS_MMPROJ_SHA256"
      - name: Verify resident models, two replies, float32 PCM and clean EOF
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          for language in italian english; do
            go run ./native/piper/smoke --helper "$PWD/dist/piper/$TARGET_OS-$TARGET_ARCH/codex-piper" --dir "$RUNNER_TEMP/native-speech-models/piper" --language "$language" --threads 2
            python3 native/qwen-tts/smoke.py --helper "$PWD/dist/qwen-tts/$TARGET_OS-$TARGET_ARCH/codex-qwen-tts" --dir "$RUNNER_TEMP/native-speech-models/qwen-tts" --language "$language" --threads 2
          done
      - name: Verify optimized Qwen on CPUs accepted by the production selector
        env:
          TELEGRAMGW_QWEN_OPTIMIZED_HELPER: ${{ github.workspace }}/dist/qwen-tts/${{ matrix.os }}-${{ matrix.arch }}/lib/codex-qwen-tts-optimized
          TELEGRAMGW_QWEN_OPTIMIZED_MODEL_DIR: ${{ runner.temp }}/native-speech-models/qwen-tts
        run: go test ./internal/speech -run '^TestOptimizedNativeSpeechSmoke$' -count=1 -v -timeout 30m
      - name: Stage flat release archives
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/speech-artifacts"
          cp dist/piper/codex-piper-*.tar.gz dist/qwen-tts/codex-qwen-tts-*.tar.gz "$RUNNER_TEMP/speech-artifacts/"
      # Never save PR outputs. Main seeds caches visible to other branches/tags.
      - name: Cache successfully validated compiled helpers
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/piper
            dist/qwen-tts
          key: ${{ steps.native-identity.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speech-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/speech-artifacts/*.tar.gz
