name: Release

on:
  workflow_dispatch:
    inputs:
      installer_only:
        description: Run only installer tests after proving the changed-file scope
        type: boolean
        default: false
      baseline_tag:
        description: Latest published stable release (required for focused modes)
        type: string
        default: ''
      claude_compaction_only:
        description: Prove a Claude compaction-only diff and run affected checks without audio inference
        type: boolean
        default: false
      claude_usage_only:
        description: Prove a Claude accounting-only diff and test cost, account polling and status without voice tests
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      installer_only: ${{ steps.scope.outputs.installer_only }}
      claude_compaction_only: ${{ steps.scope.outputs.claude_compaction_only }}
      claude_usage_only: ${{ steps.scope.outputs.claude_usage_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prove the scope before selecting focused installer checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
          INSTALLER_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_only }}
          CLAUDE_COMPACTION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.claude_compaction_only }}
          CLAUDE_USAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.claude_usage_only }}
        run: |
          selected=0
          for mode in "$INSTALLER_ONLY" "$CLAUDE_COMPACTION_ONLY" "$CLAUDE_USAGE_ONLY"; do
            if [[ "$mode" == 'true' ]]; then selected=$((selected + 1)); fi
          done
          if (( selected > 1 )); then
            echo 'Focused release modes are mutually exclusive.' >&2
            exit 1
          fi
          printf 'claude_usage_only=false\n' >> "$GITHUB_OUTPUT"
          printf 'claude_compaction_only=false\n' >> "$GITHUB_OUTPUT"
          if [[ "$INSTALLER_ONLY" == 'true' ]]; then
            test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
            python3 scripts/check-installer-release.py --repo "$RELEASE_REPO" --tag "$RELEASE_TAG" --baseline "$BASELINE_TAG" --commit "$RELEASE_COMMIT"
            printf 'installer_only=true\n' >> "$GITHUB_OUTPUT"
          elif [[ "$CLAUDE_COMPACTION_ONLY" == 'true' ]]; then
            test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
            python3 scripts/check-installer-release.py --scope claude-compaction --repo "$RELEASE_REPO" --tag "$RELEASE_TAG" --baseline "$BASELINE_TAG" --commit "$RELEASE_COMMIT"
            printf 'installer_only=false\nclaude_compaction_only=true\n' >> "$GITHUB_OUTPUT"
          elif [[ "$CLAUDE_USAGE_ONLY" == 'true' ]]; then
            test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
            python3 scripts/check-installer-release.py --scope claude-usage --repo "$RELEASE_REPO" --tag "$RELEASE_TAG" --baseline "$BASELINE_TAG" --commit "$RELEASE_COMMIT"
            printf 'installer_only=false\nclaude_usage_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'installer_only=false\n' >> "$GITHUB_OUTPUT"
          fi

  security:
    needs: release-mode
    uses: ./.github/workflows/security.yml

  go-checks:
    needs: release-mode
    if: needs.release-mode.outputs.installer_only != 'true' && needs.release-mode.outputs.claude_compaction_only != 'true' && needs.release-mode.outputs.claude_usage_only != 'true'
    uses: ./.github/workflows/go-checks.yml

  native-session-archive:
    needs: release-mode
    if: needs.release-mode.outputs.installer_only != 'true' && needs.release-mode.outputs.claude_compaction_only != 'true' && needs.release-mode.outputs.claude_usage_only != 'true'
    uses: ./.github/workflows/native-session-archive.yml

  native-whisper:
    needs: release-mode
    uses: ./.github/workflows/native-whisper.yml
    with:
      version: ${{ github.ref_name }}
      run-smoke-tests: ${{ needs.release-mode.outputs.installer_only != 'true' && needs.release-mode.outputs.claude_compaction_only != 'true' && needs.release-mode.outputs.claude_usage_only != 'true' }}

  native-speech:
    needs: release-mode
    uses: ./.github/workflows/native-speech.yml
    with:
      version: ${{ github.ref_name }}
      run-smoke-tests: ${{ needs.release-mode.outputs.installer_only != 'true' && needs.release-mode.outputs.claude_compaction_only != 'true' && needs.release-mode.outputs.claude_usage_only != 'true' }}

  browser:
    needs: release-mode
    if: needs.release-mode.outputs.installer_only != 'true' && needs.release-mode.outputs.claude_compaction_only != 'true' && needs.release-mode.outputs.claude_usage_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  installer-tests:
    needs: release-mode
    if: needs.release-mode.outputs.installer_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate the installer-only scope guard
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_ci_installer_release.py
      - name: Test installer authentication, enrollment and setup guidance
        run: |
          go test ./internal/distribution -run 'Bootstrap|DocumentedInstaller' -count=1
          go test ./internal/releasemanager -run '^TestFinishGateway' -count=1
          go test ./internal/admin -run '^TestWorkerEnrollment' -count=1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test published website installation commands and copying
        run: node scripts/test-site.cjs

  claude-compaction-tests:
    needs: release-mode
    if: needs.release-mode.outputs.claude_compaction_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate scope guard and workflow graph
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_ci_installer_release.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check affected Go packages and Claude native lifecycle
        run: |
          ./scripts/check.sh format
          go vet ./internal/claudeadapter ./internal/worker ./internal/codexadapter
          go test -race ./internal/claudeadapter -run 'TestClaude(Compaction|AutomaticCompaction)|TestPersistentSessionsStreamingToolsAndHistory|TestApprovalsQuestionsAndBackgroundPermission|TestQueuedFollowUpStartsOnlyAfterPriorResult|TestInterruptAndUnexpectedExitAlwaysSettleTurn' -count=1
          go test -race ./internal/worker -run 'TestClaudeWorkerIntegration|TestWebUICompactRemainsBusyUntilNativeTurnCompletes|TestAgentCompact|TestWebUIActorCommand|TestWebUICommandIsTypedScopedAndNeverReplayed|TestCodexCommandValidationStopsBeforeRPC' -count=1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check Claude commands, compaction states and session settings on desktop and mobile
        run: node scripts/test-claude-ui.cjs

  claude-usage-tests:
    needs: release-mode
    if: needs.release-mode.outputs.claude_usage_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate the usage scope and workflow graph
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_ci_installer_release.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check account and session accounting, retained observations and read-only native controls
        run: |
          ./scripts/check.sh format
          go vet ./internal/worker ./internal/claudeadapter ./internal/codexadapter
          go test -race ./internal/worker -run 'TestClaude(Account|EnterpriseBudget|Credits|NativeUsage|Status)' -count=1
          go test -race ./internal/claudeadapter -run 'TestNativeUsage|TestClaudeStatus|TestClaudeSessionCost' -count=1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check only usage retention, retry labels and account status on desktop and mobile
        run: |
          node scripts/test-claude-ui.cjs --usage-only
          node scripts/test-claude-ui.cjs --cost-only

  package:
    needs: [native-whisper, native-speech]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}

  test-and-build:
    needs: [release-mode, go-checks, browser, package, native-session-archive, security, installer-tests, claude-compaction-tests, claude-usage-tests]
    if: >-
      always() && !cancelled() &&
      needs.release-mode.result == 'success' && needs.package.result == 'success' && needs.security.result == 'success' &&
      ((needs.release-mode.outputs.installer_only == 'true' && needs.claude-usage-tests.result == 'skipped' && needs.claude-compaction-tests.result == 'skipped' && needs.installer-tests.result == 'success' &&
        needs.go-checks.result == 'skipped' && needs.browser.result == 'skipped' && needs.native-session-archive.result == 'skipped') ||
       (needs.release-mode.outputs.installer_only == 'false' && needs.release-mode.outputs.claude_compaction_only == 'false' && needs.release-mode.outputs.claude_usage_only == 'false' && needs.claude-usage-tests.result == 'skipped' && needs.installer-tests.result == 'skipped' && needs.claude-compaction-tests.result == 'skipped' &&
        needs.go-checks.result == 'success' && needs.browser.result == 'success' && needs.native-session-archive.result == 'success') ||
       (needs.release-mode.outputs.installer_only == 'false' && needs.release-mode.outputs.claude_compaction_only == 'true' && needs.claude-usage-tests.result == 'skipped' && needs.installer-tests.result == 'skipped' && needs.claude-compaction-tests.result == 'success' &&
        needs.go-checks.result == 'skipped' && needs.browser.result == 'skipped' && needs.native-session-archive.result == 'skipped') ||
       (needs.release-mode.outputs.installer_only == 'false' && needs.release-mode.outputs.claude_compaction_only == 'false' && needs.release-mode.outputs.claude_usage_only == 'true' && needs.claude-usage-tests.result == 'success' && needs.installer-tests.result == 'skipped' && needs.claude-compaction-tests.result == 'skipped' &&
        needs.go-checks.result == 'skipped' && needs.browser.result == 'skipped' && needs.native-session-archive.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Validate tag and audited packages after all checks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Only stable vMAJOR.MINOR.PATCH tags can be released.' >&2
            exit 1
          }
          ./scripts/verify-release.sh
      - name: Attest the release checksum manifest
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/SHA256SUMS
      - name: Verify provenance with the native updater policy
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          cp -- "$BUNDLE_PATH" dist/SHA256SUMS.sigstore.json
          go run ./cmd/release-tool verify-provenance --repo "$RELEASE_REPO" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-files
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            dist/codex-telegramgw-linux-*
            dist/codex-telegramgw-darwin-*
            dist/install.sh

  publish:
    needs: test-and-build
    if: always() && !cancelled() && needs.test-and-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-files
          path: dist
      - name: Verify and publish through a resumable draft
        run: python3 scripts/publish-release.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --dist dist
