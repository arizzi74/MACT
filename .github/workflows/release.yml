name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  go-checks:
    uses: ./.github/workflows/go-checks.yml

  native-session-archive:
    uses: ./.github/workflows/native-session-archive.yml

  native-whisper:
    uses: ./.github/workflows/native-whisper.yml
    with:
      version: ${{ github.ref_name }}

  native-speech:
    uses: ./.github/workflows/native-speech.yml
    with:
      version: ${{ github.ref_name }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  package:
    needs: [native-whisper, native-speech]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}

  test-and-build:
    needs: [go-checks, browser, package, native-session-archive, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Validate tag and audited packages after all checks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Only stable vMAJOR.MINOR.PATCH tags can be released.' >&2
            exit 1
          }
          ./scripts/verify-release.sh
      - name: Attest the release checksum manifest
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/SHA256SUMS
      - name: Verify provenance with the native updater policy
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          cp -- "$BUNDLE_PATH" dist/SHA256SUMS.sigstore.json
          go run ./cmd/release-tool verify-provenance --repo "$RELEASE_REPO" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-files
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            dist/codex-telegramgw-linux-*
            dist/codex-telegramgw-darwin-*
            dist/install.sh

  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-files
          path: dist
      - name: Verify and publish through a resumable draft
        run: python3 scripts/publish-release.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --dist dist
