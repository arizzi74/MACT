name: Withdraw incompatible v0.6.32 candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/withdraw-v0632.yml]

permissions:
  contents: read

jobs:
  withdraw:
    if: github.repository == 'arizzi74/MACT' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove incompatible candidate from stable updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/424712527" > release.json
          jq -e '.tag_name == "v0.6.32" and .draft == false' release.json >/dev/null
          jq '{prerelease: true, make_latest: "false", body: ("WITHDRAWN: This candidate is incompatible with installed gateway updaters because its bundled Whisper reports a source version instead of the project release. Gateway deployment is rejected before installation. Use v0.6.31 or the corrected v0.6.33 release.\n\n" + (.body // ""))}' release.json > patch.json
          gh api --method PATCH "repos/$GH_REPO/releases/424712527" --input patch.json --jq '{tag_name, prerelease}'
          gh api "repos/$GH_REPO/releases/424712527" --jq '.prerelease' | grep -qx true
